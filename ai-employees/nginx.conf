server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /ai-employees/ {
        try_files $uri $uri/ /ai-employees/index.html;
    }

    location = /ai-employees {
        return 301 /ai-employees/;
    }

    location = / {
        return 301 /ai-employees/;
    }
}
