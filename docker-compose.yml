services:
  traefik:
    image: traefik:latest
    container_name: saas_traefik
    restart: always
    ports:
      - "80:80"
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - saas-net

  redis:
    image: redis:alpine
    container_name: saas_redis
    restart: always
    networks:
      - saas-net

  minio:
    image: minio/minio:latest
    container_name: saas_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    networks:
      - saas-net

  inngest:
    image: inngest/inngest:latest
    container_name: saas_inngest
    restart: always
    ports:
      - "8288:8288"
    command: inngest dev -u http://backend:8000/api/inngest
    networks:
      - saas-net

  backend:
    build:
      context: ./backend
    container_name: saas_backend
    restart: always
    command: sh -c "python manage.py migrate && uvicorn core.asgi:application --host 0.0.0.0 --port 8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_INTERNAL_ENDPOINT=${MINIO_INTERNAL_ENDPOINT}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_DEFAULT_BUCKET=${MINIO_DEFAULT_BUCKET}
      - INNGEST_EVENT_URL=${INNGEST_EVENT_URL}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/events`) || Path(`/`)"
      - "traefik.http.routers.django.entrypoints=web"
      - "traefik.http.services.django.loadbalancer.server.port=8000"
    networks:
      - saas-net

  frontend:
    build:
      context: ./frontend
    container_name: saas_frontend
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/app`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - saas-net

  worker:
    build:
      context: ./worker
    container_name: saas_revideo_worker
    restart: always
    volumes:
      - ./worker:/app
      - /app/node_modules
    environment:
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_INTERNAL_ENDPOINT}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_DEFAULT_BUCKET=${MINIO_DEFAULT_BUCKET}
    depends_on:
      - redis
      - minio
    networks:
      - saas-net

volumes:
  minio_data:

networks:
  saas-net:
    driver: bridge
