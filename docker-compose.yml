services:
  traefik:
    image: traefik:latest
    container_name: saas_traefik
    restart: always
    ports:
      - "80:80"
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - saas-net

  redis:
    image: redis:alpine
    container_name: saas_redis
    restart: always
    networks:
      - saas-net

  minio:
    image: minio/minio:latest
    container_name: saas_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    networks:
      - saas-net

  inngest:
    image: inngest/inngest:latest
    container_name: saas_inngest
    restart: always
    ports:
      - "8288:8288"
    command: inngest dev -u http://backend:8000/api/inngest
    networks:
      - saas-net

  backend:
    build:
      context: ./backend
    container_name: saas_backend
    restart: always
    command: sh -c "python manage.py migrate && uvicorn core.asgi:application --host 0.0.0.0 --port 8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_INTERNAL_ENDPOINT=${MINIO_INTERNAL_ENDPOINT}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_DEFAULT_BUCKET=${MINIO_DEFAULT_BUCKET}
      - INNGEST_EVENT_URL=${INNGEST_EVENT_URL}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=PathPrefix(`/api/auth`) || PathPrefix(`/api/s3`) || PathPrefix(`/api/videos`) || PathPrefix(`/api/workflows`) || PathPrefix(`/api/inngest`) || PathPrefix(`/admin`) || PathPrefix(`/events`) || Path(`/`)"
      - "traefik.http.routers.django.entrypoints=web"
      - "traefik.http.routers.django.priority=50"
      - "traefik.http.services.django.loadbalancer.server.port=8000"
    networks:
      - saas-net

  frontend:
    build:
      context: ./frontend
    container_name: saas_frontend
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/app`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - saas-net

  worker:
    build:
      context: ./worker
    container_name: saas_revideo_worker
    restart: always
    volumes:
      - ./worker:/app
      - /app/node_modules
    environment:
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_INTERNAL_ENDPOINT}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_DEFAULT_BUCKET=${MINIO_DEFAULT_BUCKET}
    depends_on:
      - redis
      - minio
    networks:
      - saas-net

  designcombo:
    build:
      context: ./designcombo
    image: remotion-designcombo
    container_name: saas_designcombo
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.designcombo.rule=PathPrefix(`/designcombo`)"
      - "traefik.http.routers.designcombo.entrypoints=web"
      - "traefik.http.services.designcombo.loadbalancer.server.port=80"
    networks:
      - saas-net

  langflow:
    image: langflowai/langflow:latest
    container_name: saas_langflow
    restart: always
    environment:
      - LANGFLOW_HOST=0.0.0.0
      - LANGFLOW_PORT=7860
      - LANGFLOW_ROOT_PATH=/langflow
      - LANGFLOW_AUTO_SAVING=true
      - LANGFLOW_AUTO_LOGIN=true
      - LANGFLOW_SUPERUSER=admin
      - LANGFLOW_SUPERUSER_PASSWORD=AdminPass2026!
    volumes:
      - ./langflow/index.html:/app/.venv/lib/python3.14/site-packages/langflow/frontend/index.html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.langflow.rule=PathPrefix(`/langflow`)"
      - "traefik.http.routers.langflow.entrypoints=web"
      - "traefik.http.routers.langflow.priority=200"
      - "traefik.http.services.langflow.loadbalancer.server.port=7860"
      - "traefik.http.routers.langflow-api.rule=PathPrefix(`/api/v1`) || PathPrefix(`/api/v2`) || PathPrefix(`/health_check`) || PathPrefix(`/healthz`) || PathPrefix(`/logs-stream`)"
      - "traefik.http.routers.langflow-api.entrypoints=web"
      - "traefik.http.routers.langflow-api.priority=200"
      - "traefik.http.routers.langflow-api.service=langflow"
    networks:
      - saas-net

  comfyui:
    image: remotion-comfyui
    container_name: saas_comfyui
    restart: always
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188", "--cpu", "--disable-auto-launch"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comfyui.rule=PathPrefix(`/comfyui`)"
      - "traefik.http.routers.comfyui.entrypoints=web"
      - "traefik.http.middlewares.comfyui-redirect.redirectregex.regex=^/comfyui$$"
      - "traefik.http.middlewares.comfyui-redirect.redirectregex.replacement=/comfyui/"
      - "traefik.http.middlewares.comfyui-strip.stripprefix.prefixes=/comfyui"
      - "traefik.http.routers.comfyui.middlewares=comfyui-redirect,comfyui-strip"
      - "traefik.http.services.comfyui.loadbalancer.server.port=8188"
    networks:
      - saas-net


volumes:
  minio_data:

networks:
  saas-net:
    driver: bridge
